<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Corner Ornaments -->
  <polygon points="24,24 64,24 24,64" fill="#f59e0b"/>
  <polygon points="776,24 736,24 776,64" fill="#f59e0b"/>
  <polygon points="24,536 64,536 24,496" fill="#f59e0b"/>
  <polygon points="776,536 736,536 776,496" fill="#f59e0b"/>

  <!-- Google & Kaggle Badges -->
  <g transform="translate(350, 65)">
    <circle cx="50" cy="30" r="28" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="50" y="38" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#38bdf8" text-anchor="middle">G</text>
  </g>

  <!-- Headers -->
  <text x="400" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="4" fill="#a5b4fc" text-anchor="middle" font-weight="600">CERTIFICATE OF RECOGNITION &amp; COMPLETION</text>
  <text x="400" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Google 5-Day AI Agents Intensive</text>

  <text x="400" y="245" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#cbd5e1" text-anchor="middle">This credential certifies that</text>
  
  <!-- Recipient Name -->
  <text x="400" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">YASH VISHWAKARMA</text>
  <line x1="200" y1="315" x2="600" y2="315" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Description -->
  <text x="400" y="355" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">has successfully mastered Autonomous AI Agent Design, Multi-Agent Coordination,</text>
  <text x="400" y="380" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Tool Calling Pipelines, and Stateful Reasoning Architecture.</text>

  <!-- Metadata box -->
  <rect x="250" y="415" width="300" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="440" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">DATE OF ISSUE: DECEMBER 18, 2025</text>

  <!-- Signatures / Stamps -->
  <g transform="translate(140, 485)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">GOOGLE DEVELOPERS</text>
  </g>

  <g transform="translate(500, 485)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">KAGGLE INTENSIVE COHORT</text>
  </g>
</svg>
