<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="kagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20beff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#kagBg)"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="url(#cyanGrad)" stroke-width="3"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#233554" stroke-width="1.5"/>

  <!-- Kaggle Logo Header -->
  <text x="400" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#20beff" text-anchor="middle" letter-spacing="2">kaggle</text>
  <text x="400" y="150" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="3" fill="#8892b0" text-anchor="middle">CERTIFICATE OF DEMONSTRATED SKILL</text>

  <text x="400" y="200" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#ccd6f6" text-anchor="middle">Python Coder Certification</text>
  <text x="400" y="250" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#8892b0" text-anchor="middle">Awarded to</text>

  <!-- Recipient -->
  <text x="400" y="305" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="900" fill="#64ffda" text-anchor="middle">YASH VISHWAKARMA</text>
  <line x1="220" y1="320" x2="580" y2="320" stroke="#64ffda" stroke-width="2"/>

  <!-- Description -->
  <text x="400" y="365" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8892b0" text-anchor="middle">For demonstrating mastery in idiomatic Python, complex data structures,</text>
  <text x="400" y="390" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8892b0" text-anchor="middle">algorithmic data workflows, and interactive notebook coding on the Kaggle platform.</text>

  <!-- Metadata -->
  <rect x="250" y="420" width="300" height="38" rx="6" fill="#1d2d50" stroke="#20beff" stroke-width="1"/>
  <text x="400" y="444" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#20beff" text-anchor="middle">DATE ISSUED: NOVEMBER 10, 2025</text>

  <g transform="translate(320, 485)">
    <text x="80" y="20" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64ffda" text-anchor="middle">VERIFIED KAGGLE PROFILE</text>
