<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Hair top & back -->
  <rect x="4" y="4" width="24" height="24" fill="#2d1b18"/>
  <rect x="4" y="4" width="24" height="8" fill="#1e1210"/>
  <!-- Face skin -->
  <rect x="6" y="10" width="20" height="16" fill="#e0aa84"/>
  <!-- Hair fringe / bangs -->
  <rect x="6" y="8" width="6" height="6" fill="#2d1b18"/>
  <rect x="12" y="8" width="4" height="4" fill="#2d1b18"/>
  <rect x="16" y="8" width="10" height="5" fill="#2d1b18"/>
  <!-- Eyes -->
  <rect x="8" y="16" width="3" height="2" fill="#ffffff"/>
  <rect x="9" y="16" width="2" height="2" fill="#2a6f97"/>
  <rect x="21" y="16" width="3" height="2" fill="#ffffff"/>
  <rect x="21" y="16" width="2" height="2" fill="#2a6f97"/>
  <!-- Nose & Mouth -->
  <rect x="14" y="18" width="4" height="2" fill="#c68b64"/>
  <rect x="13" y="22" width="6" height="2" fill="#8c4f36"/>
  <!-- Border contour -->
  <rect x="3" y="3" width="26" height="1" fill="#0f0908"/>
  <rect x="3" y="28" width="26" height="1" fill="#0f0908"/>
  <rect x="3" y="4" width="1" height="24" fill="#0f0908"/>
  <rect x="28" y="4" width="1" height="24" fill="#0f0908"/>
</svg>
