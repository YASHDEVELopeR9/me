  <rect x="7" y="18" width="8" height="5" fill="#885327"/>
  <rect x="17" y="18" width="8" height="5" fill="#885327"/>
  <!-- Silver / Iron latch -->
  <rect x="14" y="12" width="4" height="6" fill="#dedede"/>
