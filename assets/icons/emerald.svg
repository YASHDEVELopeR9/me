<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Classic emerald polygon -->
  <polygon points="10,5 22,5 28,11 28,21 22,27 10,27 4,21 4,11" fill="#17b978"/>
  <polygon points="11,7 21,7 26,12 26,20 21,25 11,25 6,20 6,12" fill="#4fe09a"/>
  <!-- Top facets highlight -->
  <polygon points="10,5 22,5 21,7 11,7" fill="#8efcc0"/>
  <polygon points="4,11 6,12 11,7 10,5" fill="#6be5a8"/>
  <!-- Center table facet -->
  <rect x="10" y="10" width="12" height="12" fill="#2fd48a"/>
  <rect x="11" y="11" width="4" height="4" fill="#a7ffd4"/>
  <!-- Dark shadow facets -->
  <polygon points="22,27 10,27 11,25 21,25" fill="#0d6c44"/>
  <polygon points="28,21 26,20 21,25 22,27" fill="#0a5234"/>
  <polygon points="4,21 6,20 11,25 10,27" fill="#0a5234"/>
</svg>
